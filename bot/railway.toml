[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required env vars (set in Railway dashboard, not here):
#   BOT_TOKEN=<from @BotFather>
#   PROPOSAL_PORT=3001
#   STRATEGY_ENGINE_PORT=3000
#   ENGINE_INTERNAL_HOST=stratex-engine.railway.internal   <- match your engine service's actual Railway name
#   STRATEGY_STORE_PATH=./data/profiles
#   WALLET_STORE_PATH=./data/wallets
